name = "seedance-site"
main = "src/index.js"
compatibility_date = "2024-09-23"
workers_dev = true

routes = [
  { pattern = "seedance.beyondmotion.net", custom_domain = true }
]

[[r2_buckets]]
binding = "DATA"
bucket_name = "seedance-data"

[vars]
SITE_ORIGIN = "https://seedance-site.pages.dev"
DATA_KEY = "data/prompts.json"
